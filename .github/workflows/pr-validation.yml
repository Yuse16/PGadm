name: PR Validation

on:
  pull_request:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  db-validate:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgadm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install pgTAP extension into PostgreSQL service
        run: |
          CID=$(docker ps -q --filter "name=postgres" | head -n1)
          if [ -z "$CID" ]; then
            echo "::error::Postgres service container not found"
            exit 1
          fi
          docker exec "$CID" bash -c "apt-get update -qq && apt-get install -y -qq postgresql-15-pgtap"

      - name: Enable pgTAP extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pgadm_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap"

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying: $f"
            psql -h localhost -U postgres -d pgadm_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pgadm_test -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Install pg_prove (pgTAP runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtap-parser-sourcehandler-pgtap-perl

      - name: Run SQL tests (pgTAP, 119 assertions)
        env:
          PGPASSWORD: postgres
        run: |
          pg_prove -h localhost -U postgres -d pgadm_test -v supabase/tests/*.sql
