name: PR Validation

on:
  pull_request:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  db-validate:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgadm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying: $f"
            psql -h localhost -U postgres -d pgadm_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pgadm_test -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Run database verification
        env:
          PGPASSWORD: postgres
        run: |
          OUTPUT=$(psql -h localhost -U postgres -d pgadm_test -v ON_ERROR_STOP=1 -f supabase/tests/ci_verify.sql 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "FAIL"; then
            echo "::error::Database verification reported FAIL"
            exit 1
          fi
          echo "Database verification passed"
